name: KiCAD ERC/DRC Check

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'power/**/*.kicad_sch'
      - 'power/**/*.kicad_pcb'
      - 'sensors/**/*.kicad_sch'
      - 'sensors/**/*.kicad_pcb'
      - '.github/workflows/kicad-erc-drc.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'power/**/*.kicad_sch'
      - 'power/**/*.kicad_pcb'
      - 'sensors/**/*.kicad_sch'
      - 'sensors/**/*.kicad_pcb'

jobs:
  kicad-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install KiCAD
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes kicad

      - name: Run ERC on Power Schematic
        run: |
          cd power
          kicad-cli sch erc power/power.kicad_sch --output erc-report.txt
          echo "=== Power Schematic ERC Report ==="
          cat erc-report.txt
          if ! grep -q "ERC messages: 0  Errors 0  Warnings 0" erc-report.txt; then
            echo "❌ Power schematic ERC failed"
            exit 1
          fi
          echo "✓ Power schematic ERC passed"

      - name: Run ERC on Sensors Schematic
        run: |
          cd sensors
          kicad-cli sch erc sensors/sensors.kicad_sch --output erc-report.txt
          echo "=== Sensors Schematic ERC Report ==="
          cat erc-report.txt
          if ! grep -q "ERC messages: 0  Errors 0  Warnings 0" erc-report.txt; then
            echo "❌ Sensors schematic ERC failed"
            exit 1
          fi
          echo "✓ Sensors schematic ERC passed"

      - name: Run DRC on Power Board
        run: |
          cd power
          kicad-cli pcb drc power/power.kicad_pcb --refill-zones --output drc-report.txt
          echo "=== Power Board DRC Report ==="
          cat drc-report.txt
          if ! grep -q "Found 0 DRC violations" drc-report.txt || \
             ! grep -q "Found 0 unconnected pads" drc-report.txt || \
             ! grep -q "Found 0 Footprint errors" drc-report.txt; then
            echo "❌ Power board DRC failed"
            exit 1
          fi
          echo "✓ Power board DRC passed"

      - name: Run DRC on Sensors Board
        run: |
          cd sensors
          kicad-cli pcb drc sensors/sensors.kicad_pcb --refill-zones --output drc-report.txt
          echo "=== Sensors Board DRC Report ==="
          cat drc-report.txt
          if ! grep -q "Found 0 DRC violations" drc-report.txt || \
             ! grep -q "Found 0 unconnected pads" drc-report.txt || \
             ! grep -q "Found 0 Footprint errors" drc-report.txt; then
            echo "❌ Sensors board DRC failed"
            exit 1
          fi
          echo "✓ Sensors board DRC passed"

      - name: Summary
        if: success()
        run: echo "✅ All ERC and DRC checks passed!"
